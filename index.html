<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedStudentHub</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f8fb;color:#183247}
header{background:#12304a;color:#fff;padding:16px 20px}.wrap{max-width:1050px;margin:auto}
.logo{font-size:23px;font-weight:800}.logo span{color:#28d5b0}
button{cursor:pointer}.btn{padding:10px 15px;border:0;border-radius:9px;font-weight:700}.primary{background:#12a889;color:#fff}.secondary{background:#fff;color:#12304a;border:1px solid #dce5ea}
main{padding:22px}.hero,.card{background:#fff;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 6px 22px #12304a12}
.hero{background:linear-gradient(135deg,#12304a,#147d70);color:#fff}.hero input{width:100%;padding:12px;border:0;border-radius:9px;margin-top:14px}
.modal{position:fixed;z-index:9999;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:18px}
.modal.hidden{display:none}.modalbox{background:#fff;width:min(480px,100%);padding:24px;border-radius:16px}.field{width:100%;padding:11px;margin:8px 0;border:1px solid #dce5ea;border-radius:8px}.msg{min-height:20px;color:#c0392b;font-size:14px}.hidden{display:none!important}
</style>
</head>
<body>
<header><div class="wrap">
<div class="logo">MedStudent<span>Hub</span></div>
<div style="margin-top:10px">
<button type="button" id="loginBtn" class="btn secondary">Login</button>
<button type="button" id="signupBtn" class="btn primary">Sign up</button>
<button type="button" id="logoutBtn" class="btn secondary hidden">Logout</button>
<span id="userText" style="margin-left:10px"></span>
</div></div></header>

<main class="wrap">
<section class="hero">
<h1>Practice. Understand. Discuss.</h1>
<p>Medical MCQs, explanations, bookmarks and student discussions.</p>
<input id="search" placeholder="Search questions...">
</section>
<h2>MCQs</h2><div id="questions"><div class="card">Loading...</div></div>
<h2>Discussions</h2>
<div class="card"><button type="button" id="postBtn" class="btn primary">Start discussion</button><div id="discussions"></div></div>
</main>

<div id="authModal" class="modal hidden" aria-hidden="true">
<div class="modalbox">
<div style="display:flex;justify-content:space-between;align-items:center">
<h2 id="authTitle">Create account</h2>
<button type="button" id="closeBtn" class="btn secondary">Close</button>
</div>
<input id="email" class="field" type="email" autocomplete="email" placeholder="Email">
<input id="password" class="field" type="password" autocomplete="new-password" placeholder="Password (minimum 6 characters)">
<button type="button" id="submitAuth" class="btn primary">Sign up</button>
<p><a href="#" id="switchAuth">Already have an account? Login</a></p>
<div id="authMsg" class="msg"></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  const SUPABASE_URL="https://egrbgayjmjplfwjwfesq.supabase.co";
  const SUPABASE_KEY="sb_publishable_GLt4N1ChNKdPC68EI8NApQ_oYP0s8on";
  let client=null, authMode="signup", currentUser=null;

  const el=id=>document.getElementById(id);
  const modal=el("authModal");

  function showAuth(mode){
    authMode=mode;
    el("authTitle").textContent=mode==="signup"?"Create account":"Login";
    el("submitAuth").textContent=mode==="signup"?"Sign up":"Login";
    el("switchAuth").textContent=mode==="signup"?"Already have an account? Login":"Need an account? Sign up";
    el("authMsg").textContent="";
    el("password").value="";
    modal.classList.remove("hidden");
    modal.setAttribute("aria-hidden","false");
    setTimeout(()=>el("email").focus(),50);
  }
  function closeAuth(){modal.classList.add("hidden");modal.setAttribute("aria-hidden","true")}

  // These handlers are attached immediately after the DOM exists.
  el("signupBtn").addEventListener("click",()=>showAuth("signup"));
  el("loginBtn").addEventListener("click",()=>showAuth("login"));
  el("closeBtn").addEventListener("click",closeAuth);
  el("switchAuth").addEventListener("click",e=>{e.preventDefault();showAuth(authMode==="signup"?"login":"signup")});

  if(window.supabase && typeof window.supabase.createClient==="function"){
    client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  }else{
    el("authMsg").textContent="Supabase could not load. Please refresh the page.";
  }

  el("submitAuth").addEventListener("click",async()=>{
    const email=el("email").value.trim(), password=el("password").value;
    if(!client){el("authMsg").textContent="Supabase is not connected. Refresh the page.";return}
    if(!email || !password){el("authMsg").textContent="Please enter your email and password.";return}
    if(authMode==="signup" && password.length<6){el("authMsg").textContent="Password must be at least 6 characters.";return}
    el("submitAuth").disabled=true; el("authMsg").textContent="Please wait...";
    try{
      const result=authMode==="signup"
        ? await client.auth.signUp({email,password})
        : await client.auth.signInWithPassword({email,password});
      if(result.error) throw result.error;
      if(authMode==="signup" && !result.data.session){
        el("authMsg").style.color="#18794e";
        el("authMsg").textContent="Account created. Check your email to confirm your account, then log in.";
      }else{
        closeAuth(); await refreshUser();
      }
    }catch(err){
      el("authMsg").style.color="#c0392b";
      el("authMsg").textContent=err.message||"Authentication failed.";
    }finally{el("submitAuth").disabled=false}
  });

  el("logoutBtn").addEventListener("click",async()=>{if(client)await client.auth.signOut();await refreshUser()});

  async function refreshUser(){
    if(!client)return;
    const {data}=await client.auth.getSession();
    currentUser=data.session?.user||null;
    el("userText").textContent=currentUser?currentUser.email:"";
    el("loginBtn").classList.toggle("hidden",!!currentUser);
    el("signupBtn").classList.toggle("hidden",!!currentUser);
    el("logoutBtn").classList.toggle("hidden",!currentUser);
  }

  async function loadQuestions(){
    if(!client){el("questions").innerHTML='<div class="card">Supabase is not connected. Refresh the page.</div>';return}
    const {data,error}=await client.from("questions").select("*").eq("published",true).order("created_at",{ascending:false}).limit(100);
    if(error){el("questions").innerHTML='<div class="card">Could not load questions: '+escapeHtml(error.message)+'</div>';return}
    el("questions").innerHTML=data?.length?data.map(q=>'<div class="card"><b>'+escapeHtml(q.subject||"Medical")+'</b><h3>'+escapeHtml(q.question)+'</h3></div>').join(""):'<div class="card">No questions found yet.</div>';
  }
  function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
  el("search").addEventListener("input",loadQuestions);

  el("postBtn").addEventListener("click",()=>{if(!currentUser)showAuth("login");else alert("Discussion form will be added next.")});

  (async function start(){
    await refreshUser();
    await loadQuestions();
  })();
})();
</script>
</body>
</html>
